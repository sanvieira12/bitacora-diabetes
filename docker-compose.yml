services:
  postgres:
    image: postgres:16-alpine
    container_name: gluconoche-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gluconoche
      POSTGRES_USER: gluconoche
      POSTGRES_PASSWORD: gluconoche_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gluconoche -d gluconoche"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    driver: local
