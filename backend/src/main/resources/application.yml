spring:
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://localhost:5433/gluconoche
    username: ${DB_USER:gluconoche}
    password: ${DB_PASSWORD:gluconoche_dev}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8081
  servlet:
    context-path: /

jwt:
  # DEV ONLY default — override with JWT_SECRET env var in production
  secret: ${JWT_SECRET:gluconoche-dev-only-secret-change-in-production-needs-32-chars-minimum}
  expiry-seconds: 7200

logging:
  level:
    com.gluconoche: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
