spring:
  profiles:
    active: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gluconoche}
    username: ${DB_USER:gluconoche}
    password: ${DB_PASSWORD:gluconoche_dev}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    com.gluconoche: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
